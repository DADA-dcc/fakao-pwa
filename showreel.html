/* 06 — kinetic type: EASE IN. EASE OUT. NEVER LINEAR. */
const KT = [ // [start, word, bg, ink, family, cap height, target width (0 = natural), entrance]
  [0.05, 'EASE', CFG.green, CFG.ink, F.wide, 264, 1730, 'L'],
  [0.28, 'IN.', CFG.dark, CFG.paper, F.wide, 336, 0, 'U'],
  [0.53, 'EASE', CFG.paper, CFG.deep, F.cond, 768, 1680, 'D'],
  [0.78, 'OUT.', CFG.deep, CFG.paper, F.wide, 336, 0, 'R'],
  [1.03, 'NEVER', CFG.pale, CFG.ink, F.wide, 192, 1730, 'W'],
  [1.28, '~NEVER', CFG.pale, CFG.ink, F.wide, 110, 0, 'M'],

/* 07 — end card: a black burst, confetti, the brand */
function endCard(t) {
  const cx = 960, cy = 540;

  if (open < 1) { ctx.fillStyle = CFG.dark; ctx.fillRect(0, 0, CFG.w, CFG.h); circle(cx - 300, cy, 2400 * open, CFG.green); ring(cx, cy, 700 * open + 200, 'rgba(250,250,250,.7)', 10, 1 - open); }

    const a = rnd(i) * TAU, sp = 200 + rnd(i + 5) * 700, life = seg(t, 0.1, 1.6), r = sp * EZ.o3(life);

const DRAW = [identity, title, easing, morphing, systems, depth, kinetic, endCard];

/* ---------- frame chrome ---------- */
function hud(t, ink) {
  const k = CH.reduce((n, c, i) => t >= c[0] ? i : n, 0), dim = ink === CFG.ink ? 'rgba(38,37,30,.55)' : 'rgba(250,250,250,.55)';

/* ---------- master timeline: the only clock ---------- */
gsap.ticker.lagSmoothing(0);
const tl = gsap.timeline({ paused: true });

Promise.all(['700 10px ArchivoX', '700 10px ArchivoC', '700 10px ArchivoB', '10px InstrumentI', '10px JBMono', '10px JBMonoB'].map(f => document.fonts.load(f))).then(() => render(tl.time()), () => render(tl.time()));
