name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate question bank
        run: node scripts/validate-questions.mjs

      - name: Check inline <script> syntax in index.html
        run: node scripts/check-inline-scripts.mjs
