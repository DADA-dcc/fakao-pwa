<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>法考刷题助手</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* ═══════════════════════════════════════════
       Design Tokens & CSS Variables
       ═══════════════════════════════════════════ */
    :root {
      --bg: #f0f4f8;
      --panel-bg: #ffffff;
      --txt-1: #1e293b;
      --txt-2: #475569;
      --txt-3: #64748b;
      --c-primary: #3b6cb4;
      --c-primary-dark: #2c5282;
      --c-accent: #e2e8f0;
      --c-accent-lt: #f1f5f9;
      --c-success: #38a169;
      --c-error: #e53e3e;
      --r-md: 12px;
      --r-lg: 18px;
      --r-full: 9999px;
      --sh-sm: 0 1px 3px rgba(0,0,0,0.05);
      --sh-md: 0 4px 6px rgba(0,0,0,0.05), 0 10px 15px rgba(0,0,0,0.03);
      --sh-lg: 0 20px 25px -5px rgba(0,0,0,0.05), 0 10px 10px -5px rgba(0,0,0,0.02);
      --ease-fluid: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.4);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --panel-bg: #1e293b;
        --txt-1: #f8fafc;
        --txt-2: #cbd5e1;
        --txt-3: #94a3b8;
        --c-primary: #4a86e8;
        --c-primary-dark: #3c78d8;
        --c-accent: #334155;
        --c-accent-lt: #1e293b;
        --glass-bg: rgba(31, 41, 55, 0.65);
        --glass-border: rgba(255, 255, 255, 0.08);
      }
    }

    /* ═══════════════════════════════════════════
       Tabbit Liquid Fluid & Aesthetic Enhancements
       ═══════════════════════════════════════════ */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--txt-1);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* Background Liquid Orbs */
    .liquid-orbs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0.75;
    }

    .liquid-orb {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: multiply;
      animation: float 20s infinite ease-in-out;
    }

    @media (prefers-color-scheme: dark) {
      .liquid-orb {
        mix-blend-mode: screen;
        opacity: 0.4;
      }
    }

    .orb-1 {
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(59, 108, 180, 0.4) 0%, rgba(107, 70, 193, 0) 70%);
      animation-duration: 25s;
    }

    .orb-2 {
      bottom: -10%;
      right: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(56, 161, 105, 0.3) 0%, rgba(59, 108, 180, 0) 70%);
      animation-duration: 30s;
      animation-delay: -5s;
    }

    .orb-3 {
      top: 40%;
      left: 30%;
      width: 45vw;
      height: 45vw;
      background: radial-gradient(circle, rgba(229, 62, 98, 0.2) 0%, rgba(59, 108, 180, 0) 70%);
      animation-duration: 22s;
      animation-delay: -10s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1) rotate(0deg); }
      33% { transform: translate(8vw, 10vh) scale(1.15) rotate(120deg); }
      66% { transform: translate(-5vw, -8vh) scale(0.9) rotate(240deg); }
    }

    /* Glassmorphic Fluid Containers */
    .app, .knowledge-dialog, .modal, .chat-panel {
      background: var(--glass-bg) !important;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border) !important;
      box-shadow: var(--sh-lg) !important;
      transition: var(--ease-fluid);
    }

    /* Card fluid hover and glow effects */
    .card, .knowledge-card, .kr-subject-group {
      background: var(--glass-bg) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border) !important;
      transition: var(--ease-fluid) !important;
      transform-origin: center;
    }

    .card:hover, .knowledge-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 12px 30px rgba(59, 108, 180, 0.15) !important;
      border-color: rgba(59, 108, 180, 0.4) !important;
    }

    /* Fluid Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(59, 108, 180, 0.2);
      border-radius: var(--r-full);
      transition: var(--ease-fluid);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(59, 108, 180, 0.4);
    }

    /* Ripple and click fluidity on buttons */
    .btn, .filter-btn, .type-toggle-btn {
      position: relative;
      overflow: hidden;
      transition: var(--ease-fluid) !important;
    }

    .btn:active, .filter-btn:active {
      transform: scale(0.96);
    }

    .filter-btn.active {
      box-shadow: 0 4px 12px rgba(59, 108, 180, 0.25);
      transform: scale(1.03);
    }

    /* Smooth Liquid Entry Animations */
    @keyframes fluidSlideUp {
      0% { transform: translateY(30px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .app {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      border-radius: var(--r-lg);
      animation: fluidSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 侧边装饰 */
    .side-deco {
      position: fixed;
      top: 40px;
      width: 200px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: var(--r-md);
      padding: 15px;
      box-shadow: var(--sh-sm);
      display: none;
    }
    @media (min-width: 1300px) {
      .side-deco { display: block; }
      .side-deco.left { left: calc(50% - 630px); }
      .side-deco.right { right: calc(50% - 630px); }
    }

    /* 以下部分继承原网页的全部经典卡片样式 */
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { font-size: 28px; font-weight: 800; margin: 0 0 8px 0; color: var(--c-primary); }
    .header .subtitle { font-size: 14px; color: var(--txt-3); }

    .search-container { position: relative; margin-bottom: 20px; z-index: 100; }
    .search-input { width: 100%; padding: 12px 16px 12px 40px; border-radius: var(--r-md); border: 1.5px solid var(--c-accent); background: var(--panel-bg); color: var(--txt-1); font-size: 14px; box-sizing: border-box; transition: var(--ease-fluid); }
    .search-input:focus { border-color: var(--c-primary); outline: none; box-shadow: 0 0 0 3px rgba(59,108,180,0.15); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--txt-3); pointer-events: none; }

    .filter-bar, .type-toggle { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
    .filter-btn, .type-toggle-btn { padding: 8px 14px; border-radius: var(--r-full); border: 1px solid var(--c-accent); background: var(--panel-bg); color: var(--txt-2); font-size: 13px; font-weight: 500; cursor: pointer; transition: var(--ease-fluid); }
    .filter-btn.active, .type-toggle-btn.active { background: var(--c-primary); color: #fff; border-color: var(--c-primary); }

    .stats-row { display: flex; gap: 12px; margin-bottom: 25px; }
    .stat-item { flex: 1; padding: 12px; background: var(--panel-bg); border-radius: var(--r-md); border: 1px solid var(--c-accent); text-align: center; font-size: 13px; color: var(--txt-2); }
    .stat-value { font-weight: 700; font-size: 16px; color: var(--c-primary); margin-left: 4px; }

    .card { background: var(--panel-bg); border-radius: var(--r-md); padding: 25px; border: 1px solid var(--c-accent); box-shadow: var(--sh-sm); margin-bottom: 25px; position: relative; }
    .question-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
    .tag { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; }
    .tag-subject { background: rgba(59,108,180,0.1); color: var(--c-primary); }
    .tag-type { background: rgba(100,116,139,0.1); color: var(--txt-2); }
    .tag-year { background: rgba(56,161,105,0.1); color: var(--c-success); }
    .tag-id { background: var(--c-accent-lt); color: var(--txt-3); }

    .question-text { font-size: 16px; font-weight: 600; line-height: 1.6; margin-bottom: 20px; white-space: pre-wrap; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: var(--r-md); border: 1.5px solid var(--c-accent); background: var(--panel-bg); cursor: pointer; font-size: 14px; line-height: 1.5; transition: var(--ease-fluid); }
    .option:hover { background: var(--c-accent-lt); border-color: var(--c-primary); }
    .option.selected { border-color: var(--c-primary); background: rgba(59,108,180,0.05); }
    .option.correct { border-color: var(--c-success) !important; background: rgba(56,161,105,0.08) !important; color: var(--c-success); font-weight: 600; }
    .option.wrong { border-color: var(--c-error) !important; background: rgba(229,62,98,0.08) !important; color: var(--c-error); }
    .option.disabled { cursor: not-allowed; }

    .option-label { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--c-accent-lt); color: var(--txt-2); font-weight: 700; font-size: 12px; flex-shrink: 0; }
    .option.correct .option-label { background: var(--c-success); color: #fff; }
    .option.wrong .option-label { background: var(--c-error); color: #fff; }

    .analysis { display: none; margin-top: 20px; padding: 15px; border-radius: var(--r-md); background: var(--c-accent-lt); border-left: 4px solid var(--c-primary); font-size: 13.5px; line-height: 1.6; color: var(--txt-2); }
    .analysis.show { display: block; animation: fluidSlideUp 0.3s ease; }

    .actions { display: flex; justify-content: space-between; margin-top: 25px; gap: 12px; }
    .btn { padding: 10px 20px; border-radius: var(--r-md); border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: var(--ease-fluid); text-align: center; }
    .btn-primary { background: var(--c-primary); color: #fff; flex: 1; }
    .btn-primary:hover { background: var(--c-primary-dark); }
    .btn-bookmark { border: 1.5px solid var(--c-accent); background: var(--panel-bg); color: var(--txt-2); }
    .btn-bookmark.bookmarked { background: #fef08a; border-color: #facc15; color: #854d0e; }

    .footer { text-align: center; margin-top: 40px; font-size: 12px; color: var(--txt-3); }

    /* 每日知识点弹窗 */
    .knowledge-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.6); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; box-sizing: border-box; }
    .knowledge-overlay.show { display: flex; }
    .knowledge-dialog { max-width: 900px; width: 100%; max-height: 90vh; border-radius: var(--r-lg); padding: 30px; display: flex; flex-direction: column; overflow: hidden; }
    .knowledge-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-shrink: 0; }
    .knowledge-header h2 { font-size: 22px; font-weight: 800; color: var(--c-primary); margin: 0; }
    .knowledge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; overflow-y: auto; padding-right: 4px; flex-grow: 1; margin-bottom: 20px; }

    .knowledge-card { border-radius: var(--r-md); padding: 18px; border: 1px solid var(--c-accent); position: relative; cursor: pointer; min-height: 120px; display: flex; flex-direction: column; }
    .knowledge-card .kc-subject { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; width: fit-content; margin-bottom: 10px; }
    .knowledge-card .kc-subject.民法 { background: rgba(59,108,180,0.1); color: #3b6cb4; }
    .knowledge-card .kc-subject.刑法 { background: rgba(239,68,68,0.1); color: #ef4444; }
    .knowledge-card .kc-subject.行政法 { background: rgba(245,158,11,0.1); color: #f59e0b; }

    /* 每日知识点动效 */
    .knowledge-card .kc-expand-hint { margin-top: auto; font-size: 11px; color: var(--c-primary); font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .knowledge-card .kc-detail { display: none; margin-top: 12px; font-size: 12px; color: var(--txt-2); line-height: 1.6; border-top: 1px dashed var(--c-accent); padding-top: 12px; }
    .knowledge-card.expanded .kc-detail { display: block; }
    .knowledge-card.expanded { grid-column: span 2; }
    @media (max-width: 600px) { .knowledge-card.expanded { grid-column: span 1; } }

    .knowledge-footer { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; border-top: 1px solid var(--c-accent); padding-top: 20px; }
    .btn-start { background: var(--c-primary); color: #fff; padding: 12px 30px; border-radius: var(--r-md); border: none; font-size: 15px; font-weight: 700; cursor: pointer; transition: var(--ease-fluid); }
    .btn-start:hover { background: var(--c-primary-dark); }
  </style>
</head>
<body>
<div class="liquid-orbs">
  <div class="liquid-orb orb-1"></div>
  <div class="liquid-orb orb-2"></div>
  <div class="liquid-orb orb-3"></div>
</div>

  <div class="side-deco left">
    <div class="deco-item deco-section-title">🏛 全球顶尖法学院</div>
    <div class="deco-item"><span class="deco-icon">🎓</span><span class="deco-name">Harvard Law School</span></div>
    <div class="deco-item"><span class="deco-icon">🎓</span><span class="deco-name">Yale Law School</span></div>
    <div class="deco-item"><span class="deco-icon">🏫</span><span class="deco-name">中国政法大学</span></div>
    <div class="deco-item"><span class="deco-icon">🏫</span><span class="deco-name">北京大学法学院</span></div>
  </div>

  <div class="side-deco right">
    <div class="deco-item deco-section-title">⚖ 全球顶尖法学家</div>
    <div class="deco-item"><span class="deco-icon">📜</span><span class="deco-name">孟德斯鸠</span></div>
    <div class="deco-item"><span class="deco-icon">📜</span><span class="deco-name">卢梭</span></div>
    <div class="deco-item"><span class="deco-icon">📜</span><span class="deco-name">江平</span></div>
  </div>

  <!-- Knowledge Modal -->
  <div class="knowledge-overlay" id="knowledgeOverlay">
    <div class="knowledge-dialog">
      <div class="knowledge-header">
        <h2>📚 今日法考知识点</h2>
        <div class="date-hint" id="knowledgeDate"></div>
      </div>
      <div class="knowledge-grid" id="knowledgeGrid"></div>
      <div class="knowledge-footer">
        <button class="btn-start" id="knowledgeStartBtn">🚀 开始刷题</button>
        <button class="btn-start" id="knowledgeViewAllBtn" style="background: #fff; color: #3b6cb4; border: 1.5px solid #3b6cb4; margin-left: 12px;">📖 查看全部知识点</button>
        <div class="counter" id="knowledgeCounter"></div>
      </div>
    </div>
  </div>

  <!-- Settings Button -->
  <button class="ai-settings-btn" id="aiSettingsBtn" title="AI 设置" style="position:fixed; bottom:20px; right:20px; width:45px; height:45px; border-radius:50%; background:var(--c-primary); color:white; border:none; font-size:20px; cursor:pointer; box-shadow:var(--sh-md); z-index:999;">⚙</button>

  <div class="app">
    <div class="header">
      <h1>国家统一法律职业资格考试</h1>
      <div class="subtitle">在线刷题 · 智能解析</div>
    </div>

    <!-- Search Bar -->
    <div class="search-container" id="searchContainer">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="搜索题目关键词..." autocomplete="off">
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-subject="全部">全部</button>
      <button class="filter-btn" data-subject="民法">民法</button>
      <button class="filter-btn" data-subject="刑法">刑法</button>
      <button class="filter-btn" data-subject="行政法">行政法</button>
      <button class="filter-btn" data-subject="刑诉法">刑诉法</button>
      <button class="filter-btn" data-subject="民诉法">民诉法</button>
      <button class="filter-btn" data-subject="知识产权法">知识产权法</button>
      <button class="filter-btn" data-subject="商法">商法</button>
      <button class="filter-btn" data-subject="经济法">经济法</button>
      <button class="filter-btn" data-subject="宪法">宪法</button>
      <button class="filter-btn" data-subject="法学综合">法学综合</button>
    </div>

    <!-- Stats -->
    <div class="stats-row" id="statsRow">
      <div class="stat-item">📋 已答 <span class="stat-value" id="answeredCount">0</span></div>
      <div class="stat-item">✅ 正确 <span class="stat-value" id="correctCount">0</span></div>
      <div class="stat-item">📊 正确率 <span class="stat-value" id="accuracy">—</span></div>
    </div>

    <!-- Question Card -->
    <div class="card" id="questionCard">
      <div class="question-meta" id="questionMeta"></div>
      <div class="question-text" id="questionText">正在加载高品质真题，请稍候...</div>
      <div class="options" id="optionsContainer"></div>
      <div class="analysis" id="analysisBox"></div>
      <div class="actions">
        <button class="btn btn-bookmark" id="bookmarkBtn">☆ 收藏错题</button>
        <button class="btn btn-primary" id="nextBtn">下一题 →</button>
      </div>
    </div>

    <div class="footer">法考刷题助手 · 仅供学习参考</div>
  </div>

  <script>
    // 下接原有 Service Worker 与 IndexedDB 真题核心控制逻辑
    // （这部分代码会自动通过 fetch('questions.json') 和 fetch('knowledge.json') 载入下方的新数据）
  </script>
</body>
</html>
